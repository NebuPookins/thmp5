        <circle cx="290" cy="256" r="32" fill="#FF0055" stroke="none" />
        <path d="M 280 120 Q 350 256 280 392" stroke-width="24" stroke-linecap="round" />
        <path d="M 330 150 Q 390 256 330 362" stroke-width="16" stroke-linecap="round" />
        <path d="M 380 190 Q 430 256 380 322" stroke-width="16" stroke-linecap="round" />
      </g>

      <g transform="translate(8, 0)" fill="none" stroke="#00F0FF" filter="url(#glow)">
        <line x1="94" y1="256" x2="270" y2="256" stroke-width="24" stroke-linecap="round" />
        <circle cx="290" cy="256" r="32" fill="#00F0FF" stroke="none" />
        <path d="M 280 120 Q 350 256 280 392" stroke-width="24" stroke-linecap="round" />
        <path d="M 330 150 Q 390 256 330 362" stroke-width="16" stroke-linecap="round" />
        <path d="M 380 190 Q 430 256 380 322" stroke-width="16" stroke-linecap="round" />
      </g>

      <g fill="none" stroke="#FFFFFF">
        <line x1="94" y1="256" x2="270" y2="256" stroke-width="24" stroke-linecap="round" />
        <circle cx="290" cy="256" r="32" fill="#FFFFFF" stroke="none" />
        <path d="M 280 120 Q 350 256 280 392" stroke-width="24" stroke-linecap="round" />
        <path d="M 330 150 Q 390 256 330 362" stroke-width="16" stroke-linecap="round" />
        <path d="M 380 190 Q 430 256 380 322" stroke-width="16" stroke-linecap="round" />
