[package]
name = "thmp5"
version = "0.1.0"
description = "thmp5 music player"
authors = ["Nebu Pookins"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "thmp5_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enables Opus codec support via libopus (built from source if not found on the system).
# Disable with --no-default-features if you cannot build libopus or do not need Opus support.
default = ["opus"]
opus = ["dep:opus"]
# Enables transparent fallback to JACK when the default ALSA audio device becomes unavailable
# (e.g. after PulseAudio restarts or the audio server is reset).  Requires libjack-dev at
# build time; at runtime JACK is only activated when ALSA fails.
jack = ["cpal/jack"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# Async
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"

# Metadata reading
lofty = "0.22"

# Audio decoding (fingerprinting: decode to PCM for chromaprint)
symphonia = { version = "0.5", features = ["all"] }
opus = { version = "0.3", optional = true }

# Fingerprinting
rusty-chromaprint = "0.3"
thread-priority = "3"
libc = "0.2"

# HTTP client (AcoustID lookup, Last.fm scrobbling)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.22"

# Last.fm API signing (MD5)
md-5 = "0.10"

# Smart playlist query parser
pest = "2"
pest_derive = "2"

# Non-empty collections
nonempty = { version = "0.11", features = ["serialize"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.15"
dbus = "0.9"
x11rb = { version = "0.13", features = ["dpms"] }

[dev-dependencies]
tempfile = "3"
